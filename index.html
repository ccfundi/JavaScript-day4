<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Day 4 - Persistent Quick Notes</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .input-group{
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input{
            flex: 1;
            padding: 10px;
            font-size: 1rem;
        }

        button{
            padding: 10px 15px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .clear-btn{
            background-color: #6c757d;
            margin-top: 15px;
            width: 100%;
        }

        ul{
            list-style-type: none;
            padding: 0;
        }

        li{
            padding: 12px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
        }

        .delete-btn{
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <h1>Persistent Quick Notes</h1>

    <div class="input-group">
        <input type="text" id="note-input" placeholder="Type a note and press Enter...">
        <button id="add-btn">Save Note</button>
    </div>

    <ul id="notes-list"></ul>

    <button id="clear-all-btn" class="clear-btn">Clear All Saved Notes</button>

    <script src="script.js"></script>
    
</body>
</html>
